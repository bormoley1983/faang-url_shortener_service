spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/postgres}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    hikari:
      auto-commit: false
      schema: ${DATABASE_SCHEMA:url_shortener_service}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DATABASE_SCHEMA:url_shortener_service}
        globally_quoted_identifiers: true
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: ${DATABASE_SCHEMA:url_shortener_service}
    liquibase-schema: ${DATABASE_SCHEMA:url_shortener_service}

  data:
    redis:
      host: ${REDIS_URL:host.docker.internal}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    enabled: ${SWAGGERUI_ENABLED:true}
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

server:
  port: 18080
  baseurl: http://localhost:18080

logging:
  level:
    root: info
    liquibase: info

api:
  title: "URL shortener service API"
  version: "0.1.0.1"
  description: "URL shortener service API for shortening long URLs"

encoder:
  settings:
    batchSize: 1000

cache:
  url:
    prefix: ${URL_CACHE_PREFIX:url:redirect:v1:}
  hash:
    size: 1000
    threshold-percent: 20
    batch-size: 500
    db-threshold: 100
    refill-wait-timeout-ms: ${HASH_CACHE_REFILL_WAIT_TIMEOUT_MS:5000}

executor:
  core-pool-size: 2
  max-pool-size: 4
  queue-capacity: 50
  keep-alive-time: 60

schedulers:
  config:
    assignedTreads: 10
    corePoolSize: 5
    maximumPoolSize: 20
    queueCapacity: 1000
    hashesGenerator:
     threadNamePrefix: "hashesGenerator-"
     cronExpression: "0 * * * * *"
    cleanupOutdatedHashes:
      numberOfDaysForOutdatedHashes: 365
      threadNamePrefix: "cleanupOutdatedHashes-"
      cronExpression: "0 * * * * *" #once a day

shortener:
  domain: http://localhost:18080/url
  allow-private-network-targets: ${URL_ALLOW_PRIVATE_NETWORK_TARGETS:false}
