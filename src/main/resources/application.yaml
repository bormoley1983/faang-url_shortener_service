spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    redis:
      port: 6379
      host: localhost
      config:
        cache-ttl: 30

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

hash:
  cash:
    executor:
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 100
      keep-alive-time: 60
      thread-name-prefix: hash-cache-
    capacity: 2000
    percent: 20

url:
  ttl-days: 100
  prefix-url: https://sh.c/

hash-generator:
  batch:
    size: 10000
scheduler:
  enabled: true
  tasks:
    generate-batch:
      cron: 0 0 0 * * *
    cleaner:
      cron: 0 0 2 * * *
      batch-size: 10000
thread:
  core-pool-size: 4
  max-pool-size: 10
  queue-capacity: 100
  await-termination-seconds: 60