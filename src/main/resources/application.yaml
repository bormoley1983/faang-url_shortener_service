spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

logging:
  level:
    root: info

scheduler:
  cron:
    midnight-everyday: "0 0 0 * * ?"

hash:
  cache:
    executor:
      pool-size: 2
      queue-size: 100
  generator:
    executor:
      pool-size: 2
      queue-size: 10




app:
  base-url: http://localhost:8080