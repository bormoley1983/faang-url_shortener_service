spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

  redis:
    host: localhost
    port: 6379

    base:
      chars: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

    app:
      hash:
        cache:
          size: 100
          threshold-percent: 20

    url-shortener:
      base-url: http://localhost:8080

    thread-pool:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 20
      thread-name-prefix: hash-async-