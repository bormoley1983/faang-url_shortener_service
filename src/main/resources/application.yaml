spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

url-shortener:
  domain: ${URL_SHORTENER_DOMAIN:https://short.ly}
  cleaner:
    cron: "0 0 0 * * *"
  hash-cache:
    max-size: 1000
    refill-threshold-percent: 0.20
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      keep-alive-time-seconds: 60
  hash-generator:
    batch-size: 1000
    executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 50
      keep-alive-time-seconds: 60
  cache:
    ttl-hours: 24
