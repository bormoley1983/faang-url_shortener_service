spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

redis:
  host: localhost
  port: 6379

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8079

logging:
  level:
    root: info

url-shortener:
  hash-generator:
    batch-size: 1000000
    pool-size: 10000
    queue-size: 50000

    pool-core-size: 50      # Core pool size для hashGeneratorExecutor
    pool-max-size: 100      # Max pool size для hashGeneratorExecutor


  hash-cache:
    pool-core-size: 50     # Core pool size для hashCacheExecutor
    pool-max-size: 100      # Max pool size для hashCacheExecutor
    size: 100000
    queue-size: 5000
    refill-threshold-percent: 30
  base-url: "http://localhost:8079/v1/url"



  cleanup:
    expiration-days: 1

cleaner:
  cron: "0 0 3 * * *"
