spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

hash:
  batchSize: 1000
  threadPool:
    size: 4
    queueCapacity: 1000

hash-cache:
  capacity: 10_000
  refill-threshold-percent: 20
  refill-batch-size: 3_000

hash-cache-executor:
  pool-size: 2
  queue-capacity: 10

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  shortener:
    base-url: http://localhost:8080
  url-cache:
    ttl: 30d
    version: v1
    module: urlshortener
    urlEntity: url

logging:
  level:
    root: info