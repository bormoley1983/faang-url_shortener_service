spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

app:
  hash:
  batch-size: 100
  generator:
  cron: "0 0 0,4,8,12 * * *"

base:
  chars: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

thread-pool:
  core-pool-size: 3
  max-pool-size: 8
  queue-capacity: 70
  thread-name-prefix: hash-generator-

cleaner:
  cron: "0 0 2 * * *"