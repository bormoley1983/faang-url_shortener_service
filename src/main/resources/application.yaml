spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      db.owner: ${DB_USERNAME:user}
      db.schema: ${DB_SCHEMA:public}

server:
  port: 8080

logging:
  level:
    root: info
