spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  data:
    redis:
      port: 6379
      host: localhost
      ttl-days: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      batch_size: 1000  # Группирует до 5000 операций в батч
      seq_batch_size: 1020
      order_inserts: true

    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

hashes:
  delete-scheduled:
    cron: "0 0 0 * * *"

logging:
  level:
    root: info

shortener:
  host:  "http://localhost:8080/short-url/"