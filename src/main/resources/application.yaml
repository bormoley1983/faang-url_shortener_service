spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
      password:
      database: 0
      timeout: 100 #ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 10
          max-wait: 50 #ms
          time-between-eviction-runs: 10s
        shutdown-timeout: 10 #ms
      connect-timeout: 50 #ms
      ssl: false

redis:
  pipeline:
    enabled: true
    batch-size: 100
  lua:
    enabled: true
  serialize:
    use-string-only: true
  local-buffer:
    enabled: true
    size: 500
    refill-threshold: 100
  hash:
    ttl: 4 # cколько дней храниться хеш в редис

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8079

logging:
  level:
    root: info


app:
  sheduled:
    time:
      cleaner: "0 0 3 * * ?" # в 3 ночи
    check:
      hash:  "*/15 * * * * ?" # каждые 20 секунд

number:
  days:
    hash:
      storage: 5 # cколько дней храниться хеш в бд

base:
  get:
    request: http://localhost:8079/urt-shortener/

hash:
  local:
    count:
      hash: 10000
    size:
      minimum: 0.2 # проценты/100
  generator:
    count:
      pool-executor: 50
    batch-size:
      executor: 2100
      save-bd: 1000
    max-range: 400000
    hashes-in-bd:
      minimum: 150000

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics, info
      base-path: /actuator

    # Настройки конкретных эндпоинтов
    prometheus:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true

  metrics:
    # 1. ТЕГИ приложения (обязательно!)
    tags:
      application: ${spring.application.name}
      environment: development
      instance: ${spring.application.instance-id:${random.value}}

    # 2. ВКЛЮЧЕНИЕ метрик
    enable:
      # Основные
      jvm: true              # JVM метрики (память, GC, threads)
      http: true             # HTTP метрики
      process: true          # Процесс (uptime, CPU)
      system: true           # Системные метрики

      # Базы данных
      hikaricp: true         # HikariCP connection pool
      jdbc: true             # JDBC метрики
      data.source: true      # DataSource метрики

      # Кэш и очереди
      cache: true            # Spring Cache
      redis: true            # Redis (если есть spring-data-redis)
      kafka: true            # Kafka (если есть)

      # Логирование
      logback: true          # Logback метрики

      # Веб-сервер
      tomcat: true           # Tomcat метрики
      undertow: true         # Undertow метрики