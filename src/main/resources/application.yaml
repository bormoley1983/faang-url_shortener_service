spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
      password:
      database: 0
      timeout: 100 #ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 10
          max-wait: 50 #ms
          time-between-eviction-runs: 10s
        shutdown-timeout: 10 #ms
      connect-timeout: 50 #ms
      ssl: false

redis:
  pipeline:
    enabled: true
    batch-size: 100
  lua:
    enabled: true
  serialize:
    use-string-only: true
  local-buffer:
    enabled: true
    size: 500
    refill-threshold: 100
  hash:
    ttl: 4 # cколько дней храниться хеш в редис

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8079

logging:
  level:
    root: info


app:
  sheduled:
    time:
      cleaner: "0 0 3 * * ?" # в 3 ночи
    check:
      hash:  "*/20 * * * * ?" # каждые 20 секунд

number:
  days:
    hash:
      storage: 5 # cколько дней храниться хеш в бд

hash:
  generator:
    max-range: 100000
    hashes-in-bd:
      minimum: 15000
  local-hash: 1000