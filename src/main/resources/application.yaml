spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

redis:
  host: localhost
  port: 6379

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8079

logging:
  level:
    root: info

url-shortener:
  hash-generator:
    batch-size: 100000
    pool-size: 5
    queue-capacity: 50

  hash-cache:
    refill-threshold-percent: 20
    size: 100000

cleaner:
  cron: "0 0 3 * * *"