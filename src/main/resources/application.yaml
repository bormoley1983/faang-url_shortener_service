spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

server:
  port: 8080

logging:
  level:
    root: info

app:
  redis:
    keys:
      cache-repository: cache_repository
  thread-pool:
    async:
      generated-hash:
        core-pool-size: 5
        max-pool-size: 10
        queue-capacity: 10_000
  batch:
    generated-hash: 10_000
    getting-hash: 5_000

  short-url:
    base: http://localhost:8080/urls

  scheduler:
    cleanUpUrl: 0 0 0 * * *