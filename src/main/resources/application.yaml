spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mvc:
    servlet:
      path: /sh.com

server:
  port: 8080

logging:
  level:
    root: info

hash:
  batch-size: 20
  cache:
    capacity: 5
    threshold: 0.2

threadpool:
  core-size: 5
  max-size: 10
  queue-capacity: 100

execution:
  frequency: '@daily'