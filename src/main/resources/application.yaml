spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
    hikari:
      maximum-pool-size: 5000

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
      password:
      database: 0
      timeout: 1000 #ms
      lettuce:
        pool:
          max-active: 5000
          max-idle: 5000
          min-idle: 1000
          max-wait: 5000 #ms
          time-between-eviction-runs: 10s
        shutdown-timeout: 1000 #ms
      connect-timeout: 1000 #ms
      ssl: false

redis:
  host: localhost
  port: 6379

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8079

logging:
  level:
    root: info

url-shortener:
  hash-generator:
    batch-size: 1000000
    pool-size: 10000
    queue-size: 50000

    pool-core-size: 50
    pool-max-size: 100


  hash-cache:
    pool-core-size: 500
    pool-max-size: 1000
    size: 200000
    queue-size: 5000
    refill-threshold-percent: 60
  base-url: "http://localhost:8079/v1/url"



  cleanup:
    expiration-days: 1

cleaner:
  cron: "0 0 3 * * *"
